spring:
  application:
    name: ai-passage-creator
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage?Unicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456
  # Jackson 全局时间格式配置
  jackson:
    time-zone: GMT+8
  ai:
    openai:
      # 阿里云 DashScope 的 OpenAI 兼容模式端点
      # 注意: Spring AI 1.1.0 的 OpenAiApi 内部已自动拼接 "/v1/chat/completions",
      #       因此 base-url 只能写到 /compatible-mode, 不能带末尾的 /v1, 否则会变成 /v1/v1 导致 404
      #       (qwen3.7-plus 等模型仅在该兼容模式可用, DashScope 原生接口会报 url error)
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      # 你的阿里云模型密钥
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          # 不指定 model 默认 gpt-4o，这里明确写死
          model: qwen3.7-plus
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.zkx.aipassagecreator.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 文章生成模块配置（敏感信息通过环境变量注入，本地调试可在环境变量或此处填写）
article:
  # Pexels 图片搜索
  pexels:
    # 在环境变量 PEXELS_API_KEY 中配置，或直接填入
    api-key: ${DASHSCOPE_API_KEY:}
    per-page: 1
  # AI 生图（NanoBanana 策略，走 DashScope 通义万相文生图）
  image:
    nano-banana:
      # 文生图模型（默认 wanx2.1-t2i-turbo）
      model: wanx2.1-t2i-turbo
      # API key 复用 spring.ai.openai.api-key，无需单独配置
  # 腾讯云 COS 图片上传
  cos:
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ap-guangzhou
    bucket: zkx-1374009979
    prefix: article
